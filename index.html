<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>順時達 SST-V14 台灣生活圈全流程互助網</title>
    <meta name="theme-color" content="#FF6B00">
    <!-- Leaflet 開源地圖 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="logo">⚡ 順時達 SST-V14 (🇹🇼 台灣試辦區)</div>
        <button class="sos-btn" onclick="triggerSOS()">🚨 SOS 警報</button>
    </header>

    <main class="app-container">

        <!-- 角色切換分頁 -->
        <div class="role-tabs">
            <button id="tab-buyer" class="tab-btn active" onclick="switchRole('buyer')">🛒 購物者發起需求</button>
            <button id="tab-driver" class="tab-btn" onclick="switchRole('driver')">🛵 運送者接單配送</button>
        </div>

        <!-- 區塊 1：購物者發起託帶需求 (含音訊廣播) -->
        <section id="buyer-section" class="card">
            <h3>📢 1. 購物者：發起託帶需求單</h3>
            <div class="form-group">
                <label>📍 取貨地點/店家名稱：</label>
                <input type="text" id="req-pickup" value="新北市永和區樂華特約點">
            </div>
            <div class="form-group">
                <label>🍲 託帶品項描述：</label>
                <input type="text" id="req-item" value="手作清淡營養水煮餐盒 (鎖熱急件)">
            </div>
            <div class="form-group">
                <label>🏠 送達目的地/地址：</label>
                <input type="text" id="req-dropoff" value="新北市永和區中山路一段">
            </div>
            <div class="form-group">
                <label>💰 願付服務費 (NTD)：</label>
                <input type="number" id="req-fee" value="45">
            </div>
            <button class="btn btn-primary" onclick="publishBuyerOrder()">
                🔊 發布需求並廣播音訊 (上貼網頁)
            </button>
        </section>

        <!-- 區塊 2：運送者大廳 (查詢路線與接單) -->
        <section id="driver-section" class="card" style="display:none;">
            <div class="card-title-row">
                <h3>📋 2. 待接訂單大廳 (AI 順路線查詢)</h3>
                <span class="live-pulse">🟢 算力連線中</span>
            </div>
            <div id="order-lobby" class="order-box">
                <p><strong>單號：</strong> <span id="lobby-id">#SST-TW-0816</span></p>
                <p><strong>品項：</strong> <span id="lobby-item">手作清淡營養水煮餐盒</span></p>
                <p><strong>路線：</strong> <span id="lobby-route">樂華特約點 ➔ 中山路一段 (1.2 km)</span></p>
                <p><strong>收益預估：</strong> <span id="lobby-fee" class="price-highlight">$45 NTD (實得 $36)</span></p>
                <button class="btn btn-success" onclick="acceptOrder()">
                    ⚡ 查閱路線並確認接單 (響鈴通知)
                </button>
            </div>
        </section>

        <!-- 區塊 3：AI 順路路線圖 (Leaflet) -->
        <section class="card map-card">
            <h3>📍 AI 最優鎖熱順路線圖 (永和示範生活圈)</h3>
            <div id="map" style="height: 190px; width: 100%; border-radius: 8px; z-index: 1;"></div>
        </section>

        <!-- 區塊 4：SST 標準送貨與防禦流程 -->
        <section id="delivery-flow-section" class="card" style="display:none;">
            <h3>🛵 3. SST 送貨防禦流程執行中</h3>
            
            <!-- 法定禁品切結 -->
            <div class="legal-box" style="margin-bottom:10px;">
                <input type="checkbox" id="legal-agreement">
                <label for="legal-agreement">
                    本人切結委託物<strong>非毒品、槍砲刀械、洗錢贓款等法定禁品</strong>。若有不實願負個人名下全部財產無限清償責任與百萬違約金。
                </label>
            </div>

            <!-- 食安存證照片與簽名 -->
            <div class="photo-grid">
                <div class="photo-box">
                    <label>照片 A：封口前內容物</label>
                    <input type="file" id="photo-a" accept="image/*">
                </div>
                <div class="photo-box">
                    <label>照片 B：親簽貼紙</label>
                    <input type="file" id="photo-b" accept="image/*">
                </div>
            </div>

            <div class="signature-box" style="margin: 8px 0;">
                <div class="sig-header">
                    <label>🖊️ 出餐人騎縫親簽：</label>
                    <button class="btn-clear" onclick="clearSignature()">重簽</button>
                </div>
                <canvas id="sig-canvas" width="320" height="80"></canvas>
            </div>

            <!-- 交付模式選擇 -->
            <div class="delivery-modes">
                <button class="btn btn-success" onclick="reportStatus('模式A：定點門口零接觸放置', 0)">🏠 模式 A：零接觸門口放置</button>
                <button class="btn btn-primary" onclick="reportStatus('模式B：面交完成', 0)">📍 模式 B：鄰近點面交 (折抵 $10)</button>
                <button class="btn btn-care" onclick="reportStatus('模式C：長者關懷平安送達', 0)">👵 模式 C：長者應門平安交付</button>
                <button class="btn btn-abandon" onclick="triggerWaitAndLeave()">⏳ 買家失聯逾 10 分鐘免責留置</button>
            </div>

            <button class="btn btn-danger" onclick="submitFoodSafetyReport('store_A')">🚨 通報食安瑕疵</button>
            <button class="btn btn-secondary" onclick="reportBrake()">🛑 煞車退單 (責任凍結)</button>
        </section>

        <!-- 即時系統 Log -->
        <div id="status-log" class="status-log">系統狀態：SST-V14 運作中，等待發起需求或接單。</div>

    </main>

    <script src="app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof L !== 'undefined') {
                window.mapInstance = L.map('map').setView([25.0086, 121.5173], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap 台灣試辦'
                }).addTo(window.mapInstance);
                L.marker([25.0086, 121.5173]).addTo(window.mapInstance)
                    .bindPopup('<b>永和特約點 (取貨)</b><br>AI 鎖熱直達')
                    .openPopup();
                L.marker([25.0120, 121.5140]).addTo(window.mapInstance)
                    .bindPopup('<b>中山路一段 (送達)</b>');
            }
        });
    </script>
</body>
</html>
